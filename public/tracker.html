<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="css/tracker.css">
  <link rel="stylesheet" href="css/tracker.css">

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/tracker.js"></script>
</head>
<body>

  <div id="cursor-glow"></div>
  <canvas id="particle-canvas"></canvas>
  <div class="grid-overlay"></div>

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-mark">
          <div class="bm-icon">⚡</div>
          <div class="bm-ring"></div>
        </div>
        <div class="brand-text">
          <div class="brand-name">NEXUS</div>
          <div class="brand-sub">JEE · 2026</div>
        </div>
      </div>

      <!-- User chip -->
      <div class="user-chip" id="userChip">
        <div class="uc-avatar" id="userAvatar">?</div>
        <div class="uc-info">
          <div class="uc-name" id="userName">Guest</div>
          <div class="uc-email" id="userEmail">local mode</div>
        </div>
        <button class="uc-logout" onclick="handleLogout()" title="Sign out">↩</button>
      </div>
    </div>

    <!-- Nav -->
    <div class="nav-section">
      <button class="nav-pill active" id="nav-dash" onclick="showHome()">
        <span class="np-ic">⬡</span><span class="np-lbl">Dashboard</span>
      </button>
      <button class="nav-pill" id="nav-analytics" onclick="showAnalytics()">
        <span class="np-ic">◈</span><span class="np-lbl">Analytics</span>
      </button>
    </div>

    <div class="sidebar-divider"></div>
    <div class="sidebar-label">SUBJECTS</div>

    <div class="subject-list" id="subjectList"></div>

    <div class="sidebar-footer">
      <button class="btn btn-primary btn-full" onclick="openModal('addSubjectModal')">
        <span>+</span> Add Subject
      </button>
    </div>
  </nav>

  <!-- MAIN -->
  <main id="main">

    <!-- TOPBAR (subject view only) -->
    <header id="topbar" style="display:none">
      <div class="tb-left">
        <div class="tb-breadcrumb" id="tb-breadcrumb">JEE › ...</div>
        <div class="tb-title-row">
          <div class="tb-dot" id="tb-dot"></div>
          <h2 class="tb-title" id="tb-title">—</h2>
        </div>
        <div class="tb-meta" id="tb-meta"></div>
        <div class="tb-progress-bar" id="tb-progress-bar">
          <div class="tpb-doing" id="tpb-doing"></div>
          <div class="tpb-mastered" id="tpb-mastered"></div>
          <div class="tpb-bg"></div>
        </div>
      </div>
      <div class="tb-actions">
        <button class="btn" onclick="openAddChapterModal()">+ Chapter</button>
        <button class="btn btn-ghost icon-btn" onclick="showSubjectCtx(event)" aria-label="More options">⋯</button>
      </div>
    </header>

    <!-- PAGES -->
    <div id="page-home" class="page active"></div>
    <div id="page-content" class="page" style="display:none; padding:28px 36px; flex:1"></div>
    <div id="page-analytics" class="page" style="display:none; padding:28px 36px; flex:1"></div>
  </main>

  <!-- ─── CONTEXT MENU ─── -->
  <div class="ctx-menu" id="ctxMenu"></div>

  <!-- ─── TOAST ─── -->
  <div class="toast" id="toast"></div>

  <!-- ─── MODALS ─── -->

  <!-- Add Subject -->
  <div class="modal-overlay" id="addSubjectModal">
    <div class="modal">
      <div class="modal-title">New Subject</div>
      <div class="field">
        <label>Subject Name</label>
        <input type="text" id="ms_name" placeholder="e.g. Physical Chemistry">
      </div>
      <div class="field">
        <label>Class</label>
        <select id="ms_class">
          <option value="11">Class 11</option>
          <option value="12">Class 12</option>
        </select>
      </div>
      <div class="field">
        <label>Type</label>
        <select id="ms_type">
          <option value="normal">Normal Subject</option>
          <option value="chemistry">Chemistry (PC / OC / IOC sections)</option>
        </select>
      </div>
      <div class="field">
        <label>Icon (emoji)</label>
        <input type="text" id="ms_icon" placeholder="⚛" maxlength="4">
      </div>
      <div class="field">
        <label>Color</label>
        <div class="color-row" id="ms_colors"></div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('addSubjectModal')">Cancel</button>
        <button class="btn-ok" onclick="saveNewSubject()">Create</button>
      </div>
    </div>
  </div>

  <!-- Add Chapter -->
  <div class="modal-overlay" id="addChapterModal">
    <div class="modal">
      <div class="modal-title">Add Chapter</div>
      <div class="field">
        <label>Chapter Title</label>
        <input type="text" id="mc_title" placeholder="e.g. Rotational Mechanics">
      </div>
      <div class="field">
        <label>Note (optional)</label>
        <input type="text" id="mc_desc" placeholder="key topics, weightage…">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('addChapterModal')">Cancel</button>
        <button class="btn-ok" onclick="saveNewChapter()">Add</button>
      </div>
    </div>
  </div>

  <!-- Edit Chapter -->
  <div class="modal-overlay" id="editChapterModal">
    <div class="modal">
      <div class="modal-title">Edit Chapter</div>
      <div class="field"><label>Title</label><input type="text" id="ech_title"></div>
      <div class="field"><label>Note</label><input type="text" id="ech_desc"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('editChapterModal')">Cancel</button>
        <button class="btn-ok" onclick="saveEditChapter()">Save</button>
      </div>
    </div>
  </div>

  <script src="js/particles.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tracker.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
